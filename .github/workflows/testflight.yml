name: Build & Deploy to TestFlight

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  testflight:
    name: Build & Upload to TestFlight
    runs-on: macos-26

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Import Apple Distribution Certificate
        uses: Apple-Actions/import-codesign-certs@v7
        with:
          p12-file-base64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          p12-password: ${{ secrets.P12_PASSWORD }}
          create-keychain: true
          keychain-password: ${{ secrets.KEYCHAIN_PASSWORD }}

      - name: Download Provisioning Profiles
        uses: Apple-Actions/download-provisioning-profiles@v7
        with:
          bundle-id: 'com.gaspar.rutassendero.RutasSendero'
          profile-type: 'IOS_APP_STORE'
          issuer-id: ${{ secrets.APP_STORE_ISSUER_ID }}
          api-key-id: ${{ secrets.APP_STORE_KEY_ID }}
          api-private-key: ${{ secrets.APP_STORE_PRIVATE_KEY }}

      - name: Build & Archive
        run: |
          xcodebuild -version
          echo "iOS SDK version: $(xcrun --sdk iphoneos --show-sdk-version)"

          BUILD_NUM=$(( GITHUB_RUN_NUMBER + 10 ))
          echo "Compiling build number: $BUILD_NUM"

          xcodebuild archive \
            -workspace ios/rutassenderos.xcworkspace \
            -scheme RutasSendero \
            -configuration Release \
            -archivePath $RUNNER_TEMP/RutasSendero.xcarchive \
            -destination "generic/platform=iOS" \
            CURRENT_PROJECT_VERSION="$BUILD_NUM" \
            CODE_SIGN_STYLE="Manual" \
            DEVELOPMENT_TEAM="RC8B9D3TLL" \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="RutasSendero AppStore Profile"

      - name: Export IPA
        run: |
          xcodebuild -exportArchive \
            -archivePath $RUNNER_TEMP/RutasSendero.xcarchive \
            -exportPath $RUNNER_TEMP/export \
            -exportOptionsPlist ios/RutasSendero/ExportOptions.plist

      - name: Upload to TestFlight
        uses: Apple-Actions/upload-testflight-build@v5
        with:
          app-path: ${{ runner.temp }}/export/RutasSendero.ipa
          issuer-id: ${{ secrets.APP_STORE_ISSUER_ID }}
          api-key-id: ${{ secrets.APP_STORE_KEY_ID }}
          api-private-key: ${{ secrets.APP_STORE_PRIVATE_KEY }}
